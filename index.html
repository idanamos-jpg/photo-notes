<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notesapp</title>
<meta name="theme-color" content="#0d6b5e">
<meta name="description" content="תיעוד בתמונות והערות בסגנון צ׳אט, עם ייצוא ל-PDF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notesapp">
<script src="lib/jspdf.umd.min.js"></script>
<style>
@font-face{font-family:'Heebo';font-weight:400;font-display:swap;src:url(fonts/heebo-hebrew-400-normal.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Heebo';font-weight:500;font-display:swap;src:url(fonts/heebo-hebrew-500-normal.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Heebo';font-weight:700;font-display:swap;src:url(fonts/heebo-hebrew-700-normal.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Heebo';font-weight:400;font-display:swap;src:url(fonts/heebo-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Heebo';font-weight:500;font-display:swap;src:url(fonts/heebo-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Heebo';font-weight:700;font-display:swap;src:url(fonts/heebo-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bar:#0d6b5e; --bar-2:#0a5a4f; --accent:#1aa37a; --chat:#efe7dd; --bubble:#dcf7c8;
  --ink:#111b21; --muted:#667781; --line:#e3ddd3; --card:#fff; --danger:#d93c3c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:var(--ink);background:#d8d3cb}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
#app{height:100dvh;max-width:880px;margin:0 auto;background:#f6f4f0;position:relative;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.12)}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.bar{flex:none;display:flex;align-items:center;gap:6px;min-height:58px;padding:6px 10px;background:var(--bar);color:#fff}
.bar-title{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-sub{font-size:12.5px;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-main{flex:1;min-width:0;padding:2px 4px;border-radius:8px;cursor:pointer}
.bar-main:active{background:rgba(255,255,255,.1)}
.icon-btn{flex:none;width:42px;height:42px;border:0;border-radius:50%;background:transparent;color:inherit;display:grid;place-items:center}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.icon-btn svg{width:23px;height:23px}
.badge{margin-inline-start:auto;font-size:12px;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:20px;white-space:nowrap}
.pdf-btn{flex:none;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:18px;padding:6px 12px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px}
.pdf-btn svg{width:18px;height:18px}
.pdf-btn:hover{background:rgba(255,255,255,.12)}

/* list */
.search-wrap{padding:12px 14px 4px}
#search{width:100%;border:1px solid var(--line);background:#fff;border-radius:22px;padding:10px 16px;font:inherit;font-size:15px;outline:none}
#search:focus{border-color:var(--accent)}
.grid{flex:1;overflow:auto;padding:10px 14px 100px;display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;align-content:start}
.card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;display:flex;flex-direction:column;transition:transform .12s}
.card:active{transform:scale(.98)}
.card-thumb{aspect-ratio:4/3;background:#ece6dc center/cover no-repeat;display:grid;place-items:center;color:#b3a998}
.card-thumb svg{width:40px;height:40px}
.card-body{padding:9px 11px 11px}
.card-title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-text{font-size:13px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;line-height:1.3}
.card-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.empty{position:absolute;inset:130px 20px auto;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.fab{position:absolute;bottom:22px;left:22px;width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25);display:grid;place-items:center}
.fab svg{width:28px;height:28px}

/* feed */
.feed{flex:1;overflow-y:auto;padding:10px 12px 16px;background-color:var(--chat);
  background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1.2px);background-size:18px 18px}
.day{display:flex;justify-content:center;margin:12px 0 8px;position:sticky;top:4px;z-index:2}
.day span{background:#fff;color:#54656f;font-size:12.5px;padding:5px 12px;border-radius:8px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.msg{display:flex;justify-content:flex-start;margin:3px 0}
.bubble{position:relative;background:var(--bubble);border-radius:10px;border-start-start-radius:3px;padding:4px;max-width:min(82%,420px);box-shadow:0 1px 1px rgba(0,0,0,.1)}
.bubble.textonly{padding:6px 10px 5px}
.bubble.has-img{width:min(330px,78vw)}
.bubble img{display:block;width:100%;border-radius:7px;background:#cfe9bf;cursor:zoom-in;object-fit:cover;max-height:440px}
.txt{white-space:pre-wrap;word-wrap:break-word;font-size:15px;line-height:1.38;padding:4px 6px 0}
.bubble.textonly .txt{padding:0}
.meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;color:var(--muted);padding:2px 6px 1px;direction:ltr}
.bubble.img-only .meta{position:absolute;bottom:8px;right:10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.more{position:absolute;top:4px;left:4px;width:28px;height:28px;border:0;border-radius:50%;background:rgba(255,255,255,.75);color:#54656f;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.more svg{width:16px;height:16px}
.bubble:hover .more,.bubble:focus-within .more{opacity:1}
@media (hover:none){.more{opacity:.85}}
.pending{opacity:.75}
.pending .spin{position:absolute;inset:0;display:grid;place-items:center}
.failed{outline:2px solid var(--danger);cursor:pointer}
.failed-note{color:var(--danger);font-size:12px;padding:2px 6px}
.feed-empty{margin:40px auto;max-width:300px;text-align:center;background:#fff8dc;color:#54656f;border-radius:10px;padding:14px;font-size:14px;line-height:1.5}

/* composer */
.composer{flex:none;display:flex;align-items:flex-end;gap:6px;padding:8px;background:#f0ece6;border-top:1px solid var(--line)}
.inwrap{flex:1;display:flex;align-items:flex-end;background:#fff;border-radius:24px;padding:3px 4px;min-height:46px}
.inwrap .icon-btn{color:#54656f;width:40px;height:40px}
.inwrap .icon-btn:hover{background:#f1f1f1}
#msgInput{flex:1;border:0;outline:none;resize:none;font:inherit;font-size:16px;line-height:1.35;padding:10px 6px;max-height:140px;background:transparent}
.send{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center}
.send svg{width:22px;height:22px;transform:scaleX(-1)}
.send:disabled{background:#9fcfbf}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50}
.preview{background:#0b141a;color:#fff;display:flex;flex-direction:column}
.pv-top{display:flex;align-items:center;gap:8px;padding:8px 10px}
.pv-top span{flex:1;text-align:center;font-size:14px;opacity:.8}
.pv-stage{flex:1;min-height:0;display:grid;place-items:center;padding:6px}
.pv-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
.pv-thumbs{display:flex;gap:8px;padding:8px 12px;overflow-x:auto;justify-content:center}
.pv-thumbs .th{flex:none;width:56px;height:56px;border-radius:8px;background:#222 center/cover;border:2px solid transparent;cursor:pointer}
.pv-thumbs .th.on{border-color:var(--accent)}
.pv-thumbs .add{flex:none;width:56px;height:56px;border-radius:8px;border:1px dashed #6b7a83;background:transparent;color:#cfd6da;font-size:26px}
.pv-bottom{display:flex;gap:8px;align-items:flex-end;padding:8px 10px 14px}
.pv-bottom textarea{flex:1;background:#202c33;color:#fff;border:0;border-radius:22px;padding:12px 16px;font:inherit;font-size:16px;resize:none;outline:none;max-height:120px}
.lightbox{background:rgba(0,0,0,.92);display:grid;place-items:center;cursor:zoom-out}
.lightbox img{max-width:100vw;max-height:88vh;object-fit:contain}
.lightbox .lb-cap{position:absolute;bottom:0;left:0;right:0;color:#fff;padding:14px 18px 22px;background:linear-gradient(transparent,rgba(0,0,0,.75));white-space:pre-wrap;font-size:15px;text-align:center}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:20px}
.dlg{background:#fff;border-radius:16px;width:min(420px,100%);padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.dlg h3{margin:0 0 8px;font-size:18px}
.dlg p{margin:0 0 12px;color:#54656f;font-size:14.5px;line-height:1.5}
.dlg input,.dlg textarea{width:100%;border:1px solid #d6d0c6;border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;outline:none;margin-bottom:14px}
.dlg textarea{min-height:110px;resize:vertical}
.dlg input:focus,.dlg textarea:focus{border-color:var(--accent)}
.dlg-actions{display:flex;gap:8px;justify-content:flex-start}
.btn{border:0;border-radius:20px;padding:9px 18px;font-size:15px;font-weight:500}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:#eef0f1;color:#33424b}
.btn.danger{background:var(--danger);color:#fff}
.sheet-back{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:min(880px,100%);border-radius:16px 16px 0 0;padding:8px 0 14px}
.sheet button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:14px 22px;font-size:16px;text-align:start;color:var(--ink)}
.sheet button:hover{background:#f4f4f4}
.sheet button.danger{color:var(--danger)}
.sheet button svg{width:21px;height:21px;color:#54656f}
.sheet button.danger svg{color:var(--danger)}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#323739;color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.busy{position:fixed;inset:0;z-index:95;background:rgba(255,255,255,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:16px;color:#33424b}
.spinner{width:38px;height:38px;border-radius:50%;border:4px solid #cfe5dd;border-top-color:var(--accent);animation:sp 0.8s linear infinite}
.spinner.sm{width:30px;height:30px;border-width:3px;border-color:rgba(255,255,255,.5);border-top-color:#fff}
@keyframes sp{to{transform:rotate(360deg)}}
.drop-hint{position:absolute;inset:58px 0 62px;background:rgba(26,163,122,.15);border:3px dashed var(--accent);display:grid;place-items:center;font-size:18px;color:var(--bar);z-index:5;pointer-events:none}
.loading{padding:40px;text-align:center;color:var(--muted)}
.editor{background:#0f1417;color:#fff;display:flex;flex-direction:column;z-index:56}
.ed-top{display:flex;align-items:center;gap:2px;padding:8px}
.ed-top .flex{flex:1}
.ed-top .icon-btn:disabled{opacity:.35}
.ed-top .btn{margin-inline-start:6px}
.ed-txtbtn{border:0;background:transparent;color:#e9edef;font-size:14px;padding:8px 10px;border-radius:10px}
.ed-txtbtn:hover{background:rgba(255,255,255,.1)}
.ed-stage{flex:1;min-height:0;display:grid;place-items:center;padding:8px;overflow:hidden}
#edCanvas{touch-action:none;background:#222;box-shadow:0 0 0 1px #333;cursor:crosshair;display:block}
.ed-tools{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;justify-content:safe center}
.ed-tools button{flex:none;width:48px;height:52px;border-radius:12px;border:0;background:#232a2e;color:#e9edef;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;padding:4px 0}
.ed-tools button svg{width:22px;height:22px}
.ed-tools button .gl{font-size:19px;font-weight:700;line-height:22px;height:22px}
.ed-tools button.on{background:var(--accent)}
.ed-opts{display:flex;gap:10px;align-items:center;justify-content:center;padding:6px 8px 16px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #0f1417;box-shadow:0 0 0 2px #3a4246;cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px #fff}
.wd{width:40px;height:34px;border-radius:10px;border:0;background:#232a2e;display:grid;place-items:center;padding:0}
.wd i{display:block;background:#e9edef;border-radius:4px;width:20px}
.wd.on{background:var(--accent)}
.sep{width:1px;height:26px;background:#3a4246}
/* export dialog */
.dlg.exp{width:min(520px,100%);max-height:92dvh;overflow:auto}
.fl{display:block;font-size:13px;color:#54656f;margin:12px 0 6px;font-weight:500}
.seg{display:flex;background:#eef0f1;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px;font-size:15px;font-weight:500;color:#33424b}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--bar)}
.tpls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tpl{border:2px solid #e3ddd3;border-radius:12px;background:#fff;padding:8px 6px;text-align:center;font-size:13px;color:#33424b}
.tpl svg{width:100%;height:58px;display:block;margin-bottom:4px}
.tpl b{display:block;font-size:14px}
.tpl small{display:block;color:#7a868d;font-size:11.5px;line-height:1.3;margin-top:2px}
.tpl.on{border-color:var(--accent);background:#f1faf6}
.dlg.exp input[type=text]{margin-bottom:0}
.chk{display:flex;align-items:center;gap:8px;font-size:14.5px;margin:10px 0 0;color:#33424b}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.dlg.exp .dlg-actions{margin-top:18px}
.save-chip{margin-inline-start:auto;display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:18px;padding:6px 12px;font-size:13.5px;font-weight:500;white-space:nowrap}
.save-chip svg{width:17px;height:17px}
.save-chip:hover{background:rgba(255,255,255,.12)}
.save-chip.dirty{background:#ffb300;border-color:#ffb300;color:#3b2a00}
.icon-btn.has-dot{position:relative}
.icon-btn .dot{position:absolute;top:8px;left:8px;width:10px;height:10px;border-radius:50%;background:#ffb300;box-shadow:0 0 0 2px var(--bar)}
/* ---- PWA: safe areas (iPhone notch / home bar) + install hint ---- */
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
html,body{overscroll-behavior:none}
body{background:var(--bar)}
#app{height:100vh;height:100dvh}
.bar{min-height:calc(58px + var(--st));padding-top:calc(6px + var(--st))}
.grid{-webkit-overflow-scrolling:touch;padding-bottom:calc(100px + var(--sb))}
.feed{-webkit-overflow-scrolling:touch}
.fab{bottom:calc(22px + var(--sb))}
.composer{padding-bottom:calc(8px + var(--sb))}
.preview,.editor{padding-top:var(--st);padding-bottom:var(--sb)}
.lightbox .lb-cap{padding-bottom:calc(22px + var(--sb))}
.sheet{padding-bottom:calc(14px + var(--sb))}
#toast{bottom:calc(90px + var(--sb))}
#search{font-size:16px;-webkit-appearance:none}
@media (hover:none){.bubble.textonly{padding-left:36px}}
.install{margin:10px 14px 0;background:#fff8dc;border:1px solid #f0e2a8;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.5;color:#54500f;display:flex;gap:10px;align-items:flex-start}
.install b{color:#3c3a10}
.install .x{flex:none;border:0;background:none;font-size:20px;line-height:1;color:#8a8450;padding:0 2px}
.install .ib{display:inline-block;vertical-align:-3px;width:16px;height:16px}
.install .go{margin-top:6px;border:0;background:var(--accent);color:#fff;border-radius:16px;padding:6px 14px;font-size:14px}
</style>
</head>
<body>
<div id="app">
  <!-- רשימת פתקים -->
  <section id="listView" class="view">
    <header class="bar">
      <div class="bar-title" style="padding-inline-start:6px">הפתקים שלי</div>
      <span id="syncBadge" class="badge">💾 נשמר במכשיר</span>
      <button id="listMenuBtn" class="icon-btn" aria-label="תפריט"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
    </header>
    <div id="installHint" class="install hidden"></div>
    <div class="search-wrap"><input id="search" type="search" placeholder="חיפוש בפתקים…" autocomplete="off"></div>
    <div id="notesGrid" class="grid"><div class="loading" style="grid-column:1/-1">טוען…</div></div>
    <div id="emptyList" class="empty hidden"><b>עוד אין פתקים</b>לחץ על + כדי לפתוח פתק חדש, ואז פשוט שלח תמונות והערות — כמו בצ׳אט.</div>
    <button id="fabNew" class="fab" aria-label="פתק חדש"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </section>

  <!-- פתק פתוח -->
  <section id="noteView" class="view hidden">
    <header class="bar">
      <button id="backBtn" class="icon-btn" aria-label="חזרה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <div class="bar-main" id="noteHead" title="שינוי שם"><div id="noteTitle" class="bar-title"></div><div id="noteSub" class="bar-sub"></div></div>
      <button id="pdfBtn" class="pdf-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>ייצוא</button>
      <button id="noteMenuBtn" class="icon-btn" aria-label="תפריט"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
    </header>
    <div id="feed" class="feed"></div>
    <div id="dropHint" class="drop-hint hidden">שחרר כאן כדי להוסיף תמונות</div>
    <footer class="composer">
      <div class="inwrap">

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const fmtTime = t => { const d=new Date(t); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const fmtDate = t => { const d=new Date(t); return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2); };
const dayKey = t => { const d=new Date(t); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); };
const fullDay = t => 'יום '+DAYS[new Date(t).getDay()]+', '+fmtDate(t);
function dayLabel(t){
  const now=new Date(); const y=new Date(now); y.setDate(now.getDate()-1);
  if (dayKey(t)===dayKey(now)) return 'היום';
  if (dayKey(t)===dayKey(y)) return 'אתמול';
  return fullDay(t);
}
const listDate = t => dayKey(t)===dayKey(Date.now()) ? fmtTime(t) : fmtDate(t);
const genId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,9);

/* ---------- UI helpers ---------- */
let toastT;
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2800); }
function busy(on,text=''){ $('#busy').classList.toggle('hidden',!on); $('#busyText').textContent=text; }
function ask({title,message='',input=null,multiline=false,okText='אישור',cancelText='ביטול',danger=false,noCancel=false}){
  return new Promise(resolve=>{
    const m=$('#modal');
    m.innerHTML=`<div class="dlg" role="dialog"><h3>${esc(title)}</h3>${message?`<p>${esc(message)}</p>`:''}
      ${input!==null?(multiline?`<textarea id="dlgIn">${esc(input)}</textarea>`:`<input id="dlgIn" value="${esc(input)}">`):''}
      <div class="dlg-actions"><button class="btn ${danger?'danger':'primary'}" id="dlgOk">${esc(okText)}</button>${noCancel?'':`<button class="btn ghost" id="dlgCancel">${esc(cancelText)}</button>`}</div></div>`;
    m.classList.remove('hidden');
    const inp=$('#dlgIn');
    if(inp){ setTimeout(()=>{inp.focus(); if(!multiline) inp.select(); },30); }
    const done=v=>{ m.classList.add('hidden'); m.innerHTML=''; resolve(v); };
    $('#dlgOk').onclick=()=>done(inp?inp.value:true);
    const c=$('#dlgCancel'); if(c) c.onclick=()=>done(null);
    m.onclick=e=>{ if(e.target===m) done(null); };
    if(inp && !multiline) inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault(); done(inp.value);} };
  });
}
const ICON = {
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
  del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  pdf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  img:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg>',
  backup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>',
  restore:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></svg>',
  draw:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h5"/></svg>'
};
function sheet(items){
  return new Promise(resolve=>{
    const back=$('#sheetBack'), s=$('#sheet');
    s.innerHTML=items.map((it,i)=>`<button data-i="${i}" class="${it.danger?'danger':''}">${ICON[it.icon]||''}<span>${esc(it.label)}</span></button>`).join('');
    back.classList.remove('hidden');
    const done=v=>{ back.classList.add('hidden'); s.innerHTML=''; resolve(v); };
    s.onclick=e=>{ const b=e.target.closest('button'); if(b) done(items[+b.dataset.i].value); };
    back.onclick=e=>{ if(e.target===back) done(null); };
  });
}
function loadImg(src, cors){
  return new Promise((res,rej)=>{ const im=new Image(); if(cors) im.crossOrigin='anonymous'; im.onload=()=>res(im); im.onerror=()=>rej(new Error('image')); im.src=src; });
}


/* ---------- save / share (offline) ---------- */
function saveFile(blob,name){
  const u=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),60000);
}
async function shareFile(blob,name,title){
  try{
    const f=new File([blob],name,{type:blob.type||'application/octet-stream'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title}); return true; }
  }catch(e){ if(e&&e.name==='AbortError') return true; }
  return false;
}
const canShareFiles=()=>{ try{ return !!(navigator.canShare&&navigator.canShare({files:[new File(['x'],'x.pdf',{type:'application/pdf'})]})); }catch(e){ return false; } };

/* ---------- dirty state & tombstones ---------- */
const LS={get:k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } },set:(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} }};
const getTomb=()=>{ try{ return JSON.parse(LS.get('pn-deleted')||'{}'); }catch(e){ return {}; } };
const setTomb=t=>LS.set('pn-deleted',JSON.stringify(t));
let dirtyT=0;
function markDirty(){ LS.set('pn-dirty','1'); clearTimeout(dirtyT); dirtyT=setTimeout(refreshDirty,50); }
const isDirty=()=>LS.get('pn-dirty')==='1';
function refreshDirty(){
  const d=isDirty();
  const b=document.getElementById('saveList'); if(b){ b.classList.toggle('dirty',d); document.getElementById('saveListTxt').textContent=d?'יש שינויים — שמור':'✓ נשמר'; }
  const dot=document.getElementById('saveNoteDot'); if(dot) dot.classList.toggle('hidden',!d);
}

/* ---------- local store (IndexedDB, fallback memory) ---------- */
async function makeLocalStore(){
  let idb=null;
  try{
    idb=await new Promise((res,rej)=>{ const r=indexedDB.open('photo-notes-v1',1);
      r.onupgradeneeded=()=>{ const d=r.result; d.createObjectStore('notes',{keyPath:'id'}); d.createObjectStore('entries',{keyPath:'id'}); d.createObjectStore('blobs'); };
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
  }catch(e){ idb=null; }
  const mem={notes:new Map(),entries:new Map(),blobs:new Map()};
  const rq=r=>new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
  const op=(store,mode,fn)=>new Promise((res,rej)=>{ const t=idb.transaction([store],mode); const p=rq(fn(t.objectStore(store))); let v; p.then(x=>v=x,()=>{}); t.oncomplete=()=>res(v); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); });
  const all=s=>idb?op(s,'readonly',o=>o.getAll()):Promise.resolve([...mem[s].values()].map(x=>x instanceof Blob?x:{...x}));
  const get=(s,k)=>idb?op(s,'readonly',o=>o.get(k)):Promise.resolve(mem[s].get(k));
  let quiet=false;
  const put0=(s,v,k)=>idb?op(s,'readwrite',o=>k!==undefined?o.put(v,k):o.put(v)):(mem[s].set(k!==undefined?k:v.id,v),Promise.resolve());
  const put=(s,v,k)=>{ if(!quiet) markDirty(); return put0(s,v,k); };
  const del0=(s,k)=>idb?op(s,'readwrite',o=>o.delete(k)):(mem[s].delete(k),Promise.resolve());
  const del=(s,k)=>{ if(!quiet) markDirty(); return del0(s,k); };
  const urls=new Map();
  async function delBlob(id){ if(!id) return; if(urls.has(id)){ URL.revokeObjectURL(urls.get(id)); urls.delete(id); } await del('blobs',id); }
  async function blobUrl(id){ if(!id) return null; if(urls.has(id)) return urls.get(id); const b=await get('blobs',id); if(!b) return null; const u=URL.createObjectURL(b); urls.set(id,u); return u; }
  const noteL=new Set(), entL=new Map();
  async function removeNote(id,mark){ const t=getTomb(); const es=(await all('entries')).filter(e=>e.noteId===id);
    for(const e of es){ await delBlob(e.imageId); await delBlob(e.origId); await del('entries',e.id); if(mark) t[e.id]=Date.now(); }
    await del('notes',id); if(mark){ t[id]=Date.now(); setTomb(t); } }
  async function emitNotes(){ const ns=await all('notes'); for(const n of ns) n.thumbSrc=await blobUrl(n.thumbId); noteL.forEach(cb=>cb(ns,{fromCache:false})); }
  async function emitEntries(noteId){ const set=entL.get(noteId); if(!set||!set.size) return;
    const es=(await all('entries')).filter(e=>e.noteId===noteId).sort((a,b)=>a.createdAt-b.createdAt);
    for(const e of es){ e._src=await blobUrl(e.imageId); e._orig=e.origId?await blobUrl(e.origId):null; } set.forEach(cb=>cb(es,{fromCache:false})); }
  const clean=o=>{ const c={...o}; delete c._src; delete c._orig; delete c.thumbSrc; return c; };
  return {
    kind: idb?'local':'memory', canImages:true,
    watchNotes(cb){ noteL.add(cb); emitNotes(); return ()=>noteL.delete(cb); },
    watchEntries(noteId,cb){ if(!entL.has(noteId)) entL.set(noteId,new Set()); entL.get(noteId).add(cb); emitEntries(noteId); return ()=>entL.get(noteId).delete(cb); },
    async createNote(title){ const id=genId(), t=Date.now(); await put('notes',{id,title,createdAt:t,updatedAt:t,lastText:'',thumbId:null,count:0}); emitNotes(); return id; },
    async updateNote(id,patch){ const n=await get('notes',id); if(!n) return; await put('notes',clean({...n,...patch,modAt:Date.now()})); emitNotes(); },
    async deleteNote(id){ await removeNote(id,true); emitNotes(); },
    async addEntry(noteId,{text,blob,w,h,origBlob,ow,oh,ops,rot,createdAt}){ let imageId=null,origId=null; if(blob){ imageId=genId(); await put('blobs',blob,imageId); }
      if(origBlob){ origId=genId(); await put('blobs',origBlob,origId); }
      await put('entries',{id:genId(),noteId,text:text||'',imageId,w:w||null,h:h||null,origId,ow:ow||null,oh:oh||null,ops:ops&&ops.length?ops:null,rot:rot||0,createdAt}); emitEntries(noteId); return {imageId}; },
    async setImage(noteId,id,r){
      const e=await get('entries',id); if(!e) return {};
      const oldId=e.imageId;
      if(r.reset){ if(!e.origId) return {imageId:oldId,oldId};
        if(oldId!==e.origId) await delBlob(oldId);
        await put('entries',clean({...e,imageId:e.origId,origId:null,w:e.ow||e.w,h:e.oh||e.h,ow:null,oh:null,ops:null,rot:0,editedAt:Date.now()}));
        emitEntries(noteId); return {imageId:e.origId,oldId}; }
      const newId=genId(); await put('blobs',r.blob,newId);
      let origId=e.origId, ow=e.ow, oh=e.oh;
      if(!origId){ origId=oldId; ow=e.w; oh=e.h; } else if(oldId&&oldId!==origId) await delBlob(oldId);
      await put('entries',clean({...e,imageId:newId,origId,ow,oh,w:r.w,h:r.h,ops:r.ops,rot:r.rot,editedAt:Date.now()}));
      emitEntries(noteId); return {imageId:newId,oldId}; },
    async updateEntry(noteId,id,patch){ const e=await get('entries',id); if(!e) return; await put('entries',clean({...e,...patch})); emitEntries(noteId); },
    async deleteEntry(noteId,e){ await delBlob(e.imageId); await delBlob(e.origId); await del('entries',e.id); const t=getTomb(); t[e.id]=Date.now(); setTomb(t); emitEntries(noteId); },
    async exportAll(){
      const toB64=b=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(b); });
      const notes=(await all('notes')).map(clean), entries=(await all('entries')).map(clean), blobs={};
      for(const e of entries){ for(const k of [e.imageId,e.origId]){ if(k){ const b=await get('blobs',k); if(b) blobs[k]=await toB64(b); } } }
      return {app:'photo-notes',version:1,exportedAt:Date.now(),notes,entries,blobs};
    },
    async importAll(data,{fromFile=false}={}){
      if(!data||data.app!=='photo-notes') throw new Error('format');
      quiet=fromFile;
      try{
        const tomb=getTomb(), ft=data.deleted||{};
        for(const id in ft){ if(tomb[id]) continue; tomb[id]=ft[id];
          if(await get('notes',id)) await removeNote(id,false);
          else { const e=await get('entries',id); if(e){ await delBlob(e.imageId); await delBlob(e.origId); await del('entries',id); } } }
        setTomb(tomb);
        const ver=x=>Math.max(x.modAt||0,x.updatedAt||0,x.editedAt||0,x.createdAt||0);
        let added=0, updated=0;
        for(const n of data.notes||[]){ if(tomb[n.id]) continue; const ex=await get('notes',n.id);
          if(!ex){ await put('notes',n); added++; } else if(ver(n)>ver(ex)){ await put('notes',{...n,thumbId:n.thumbId}); updated++; } }
        for(const e of data.entries||[]){ if(tomb[e.id]||tomb[e.noteId]) continue; const ex=await get('entries',e.id);
          if(ex&&ver(e)<=ver(ex)) continue;
          for(const k of [e.imageId,e.origId]){ if(k&&data.blobs&&data.blobs[k]&&!(await get('blobs',k))){ const bl=await (await fetch(data.blobs[k])).blob(); await put('blobs',bl,k); } }
          if(ex){ for(const k of [ex.imageId,ex.origId]) if(k&&k!==e.imageId&&k!==e.origId) await delBlob(k); updated++; }
          await put('entries',e); }
        emitNotes(); for(const id of entL.keys()) emitEntries(id);
        return {added,updated};
      } finally { quiet=false; }
    }
  };
}

/* ---------- state ---------- */
const S={store:null, downloads:null, notes:[], notesLoaded:false, entries:[], entriesLoaded:false, pending:[], noteId:null, unsubE:null, query:'', pv:{items:[],idx:0}, stick:true};
const curNote=()=>S.notes.find(n=>n.id===S.noteId);

/* ---------- list view ---------- */
function renderList(){
  const g=$('#notesGrid');
  if(!S.notesLoaded){ return; }
  const q=S.query.trim().toLowerCase();
  const list=S.notes.filter(n=>!q||(n.title||'').toLowerCase().includes(q)||(n.lastText||'').toLowerCase().includes(q))
                    .sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  $('#emptyList').classList.toggle('hidden', S.notes.length>0);
  g.innerHTML=list.map(n=>`<div class="card" data-id="${esc(n.id)}">
      <div class="card-thumb" ${n.thumbSrc?`style="background-image:url('${esc(n.thumbSrc)}')"`:''}>${n.thumbSrc?'':ICON.note}</div>
      <div class="card-body"><div class="card-title">${esc(n.title||'ללא שם')}</div>
      <div class="card-text">${esc(n.lastText||'')}</div>
      <div class="card-meta"><span>${listDate(n.updatedAt||n.createdAt)}</span><span>${n.count?n.count+' רשומות':''}</span></div></div></div>`).join('')
    || (S.notes.length?`<div class="loading" style="grid-column:1/-1">לא נמצאו פתקים</div>`:'');
}
$('#notesGrid').addEventListener('click',e=>{ const c=e.target.closest('.card'); if(c) go(c.dataset.id); });

/* ---------- routing ---------- */
function go(id){ const h=id&&/^[A-Za-z0-9-]+$/.test(id)?'n-'+id:''; if(h){ if(location.hash!=='#'+h) location.hash=h; else route(); } else openNote(id); }
function route(){
  const m=location.hash.match(/^#n-([A-Za-z0-9-]+)$/);
  if(m){ if(S.noteId!==m[1]) openNote(m[1]); }
  else if(S.noteId) closeNote();
}
window.addEventListener('hashchange',route);

function openNote(id){
  if(S.unsubE){ S.unsubE(); S.unsubE=null; }
  S.noteId=id; S.entries=[]; S.entriesLoaded=false; S.pending=[]; S.stick=true;
  $('#listView').classList.add('hidden'); $('#noteView').classList.remove('hidden');
  renderHead(); renderFeed();
  let timer=setTimeout(()=>{ if(!S.entriesLoaded){ $('#feed').innerHTML='<div class="feed-empty">לא ניתן להתחבר לנתונים כרגע. נסה שוב בעוד רגע.</div>'; } },10000);
  S.unsubE=S.store.watchEntries(id,(list,meta)=>{
    if(S.noteId!==id) return;
    S.entries=list;
    if(!meta||!meta.fromCache||list.length){ S.entriesLoaded=true; clearTimeout(timer); }
    renderFeed(); renderHead();
  }, err=>{ clearTimeout(timer); S.entriesLoaded=true; renderFeed(); toast('שגיאה בטעינת הפתק'); });
  if(matchMedia('(pointer:fine)').matches) setTimeout(()=>$('#msgInput').focus(),50);
}
function closeNote(){
  if(S.unsubE){ S.unsubE(); S.unsubE=null; }
  S.noteId=null; $('#noteView').classList.add('hidden'); $('#listView').classList.remove('hidden'); renderList();
}
$('#backBtn').addEventListener('click',()=>{ if(location.hash) location.hash=''; else closeNote(); });

/* ---------- note view ---------- */
function renderHead(){
  const n=curNote();
  $('#noteTitle').textContent=n?(n.title||'ללא שם'):'פתק';
  const c=S.entries.length;
  $('#noteSub').textContent=c?`${c} רשומות · עודכן ${listDate((n&&n.updatedAt)||Date.now())}`:'הקש כאן לשינוי שם';
}
function bubbleHTML(e,{pending=false,failed=false}={}){
  const hasImg=!!e._src, hasTxt=!!(e.text&&e.text.trim());
  const cls=['bubble', hasImg?'has-img':'textonly', hasImg&&!hasTxt?'img-only':'', pending?'pending':'', failed?'failed':''].join(' ');
  const ratio=e.w&&e.h?`aspect-ratio:${e.w}/${e.h};`:'';
  return `<div class="msg"><div class="${cls}" data-id="${esc(e.id||'')}" data-pid="${esc(e.pid||'')}">
    ${hasImg?`<img src="${esc(e._src)}" style="${ratio}" loading="lazy" alt="">`:''}
    ${hasTxt?`<div class="txt">${esc(e.text)}</div>`:''}
    ${failed?'<div class="failed-note">השליחה נכשלה — הקש לנסות שוב</div>':''}
    <div class="meta">${fmtTime(e.createdAt)}${e.editedAt?' · נערך':''}${pending?' ⏳':' ✓✓'}</div>
    ${pending&&!failed&&hasImg?'<div class="spin"><div class="spinner sm"></div></div>':''}
    ${!pending?`<button class="more" aria-label="אפשרויות">${ICON.chev}</button>`:''}
  </div></div>`;
}
function renderFeed(){
  const f=$('#feed');
  const nearBottom=f.scrollHeight-f.scrollTop-f.clientHeight<120;
  if(!S.entriesLoaded && !S.pending.length){ f.innerHTML='<div class="loading">טוען…</div>'; return; }
  const all=[...S.entries.map(e=>({e})),...S.pending.map(p=>({e:p,pending:true,failed:p.failed}))];
  if(!all.length){ f.innerHTML='<div class="feed-empty">הפתק ריק.<br>צרף תמונה (או צלם) והוסף לה כיתוב — כל שליחה מתווספת לפתק.<br>בסיום: <b>ייצוא</b> למעלה — PDF או Word.</div>'; return; }
  let html='', last=null;
  for(const it of all){ const k=dayKey(it.e.createdAt); if(k!==last){ html+=`<div class="day"><span>${esc(dayLabel(it.e.createdAt))}</span></div>`; last=k; } html+=bubbleHTML(it.e,it); }
  f.innerHTML=html;
  if(S.stick||nearBottom){ f.scrollTop=f.scrollHeight; f.querySelectorAll('img').forEach(im=>{ if(!im.complete) im.addEventListener('load',()=>{ if(S.stick) f.scrollTop=f.scrollHeight; },{once:true}); }); }
}
$('#feed').addEventListener('scroll',()=>{ const f=$('#feed'); S.stick=f.scrollHeight-f.scrollTop-f.clientHeight<60; },{passive:true});

$('#feed').addEventListener('click', async ev=>{
  const b=ev.target.closest('.bubble'); if(!b) return;
  if(b.classList.contains('failed')){ const p=S.pending.find(x=>x.pid===b.dataset.pid); if(p){ p.failed=false; renderFeed(); sendOne(p); } return; }
  const e=S.entries.find(x=>x.id===b.dataset.id); if(!e) return;

  if(ev.target.closest('.more')){

    if(e._src) items.push({label:'סימון וציור על התמונה',icon:'draw',value:'draw'});
    if(e.text) items.push({label:'העתקת טקסט',icon:'copy',value:'copy'});

      if(v===null||v===e.text) return;
      try{ await S.store.updateEntry(S.noteId,e.id,{text:v,editedAt:Date.now()}); if(isLast(e)) S.store.updateNote(S.noteId,{lastText:v||'📷 תמונה'}).catch(()=>{}); }
      catch(err){ toast('השמירה נכשלה'); }
    } else if(a==='draw'){
      const r=await openEditor({src:e._orig||e._src,ops:e.ops||[],rot:e.rot||0});
      if(!r||(r.reset&&!e.origId)) return;
      busy(true,'שומר…');
      try{ const res=await S.store.setImage(S.noteId,e.id,r); const n=curNote(); if(n&&res.oldId&&n.thumbId===res.oldId) S.store.updateNote(n.id,{thumbId:res.imageId}).catch(()=>{}); }
      catch(err){ toast('השמירה נכשלה'); }
      busy(false);
    } else if(a==='copy'){

    } else if(a==='saveimg'){
      try{ const r=await fetch(e._src); const bl=await r.blob(); const nm=`תמונה-${fmtDate(e.createdAt).replace(/\./g,'-')}-${fmtTime(e.createdAt).replace(':','')}.jpg`; if(!(matchMedia('(pointer:coarse)').matches&&await shareFile(bl,nm,'תמונה'))) saveFile(bl,nm); }
      catch(err){ toast('לא ניתן לשמור את התמונה'); }
    } else if(a==='del'){
      const ok=await ask({title:'למחוק את הרשומה?',message:e._src?'התמונה והכיתוב יימחקו מהפתק.':'ההערה תימחק מהפתק.',okText:'מחיקה',danger:true});
      if(!ok) return;
      try{ await S.store.deleteEntry(S.noteId,e); S.store.updateNote(S.noteId,{count:Math.max(0,S.entries.length-1),...(isLast(e)?lastPatch(S.entries.filter(x=>x.id!==e.id)):{})}).catch(()=>{}); }
      catch(err){ toast('המחיקה נכשלה'); }
    }
  }
});
const isLast=e=>S.entries.length&&S.entries[S.entries.length-1].id===e.id;
function lastPatch(list){
  const l=list[list.length-1]; const lastImg=[...list].reverse().find(x=>x.imageId);
  return {lastText:l?(l.text||'📷 תמונה'):'', thumbId:lastImg?lastImg.imageId:null};

/* ---------- composer ---------- */
const mi=$('#msgInput');
function autoGrow(t){ t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,140)+'px'; }
mi.addEventListener('input',()=>{ autoGrow(mi); $('#sendBtn').disabled=!mi.value.trim(); });
mi.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){ e.preventDefault(); sendText(); } });
$('#sendBtn').addEventListener('click',sendText);
async function sendText(){
  const text=mi.value.trim(); if(!text||!S.noteId) return;
  mi.value=''; autoGrow(mi); $('#sendBtn').disabled=true; S.stick=true;
  const p={pid:genId(),text,createdAt:Date.now(),noteId:S.noteId}; S.pending.push(p); renderFeed();
  await sendOne(p);
}
async function sendOne(p){
  try{
    let blob=null,w=null,h=null,extra={};
    if(p.file){ const c=p.orig||await compress(p.file); p.orig=c;
      if(p.flat){ blob=p.flat.blob; w=p.flat.w; h=p.flat.h; extra={origBlob:c.blob,ow:c.w,oh:c.h,ops:p.ops,rot:p.rot}; }
      else { blob=c.blob; w=c.w; h=c.h; } }
    const r=await S.store.addEntry(p.noteId,{text:p.text,blob,w,h,...extra,createdAt:p.createdAt});
    S.pending=S.pending.filter(x=>x!==p);
    const patch={updatedAt:Date.now(),lastText:p.text||'📷 תמונה'};
    if(r&&r.imageId) patch.thumbId=r.imageId;
    // count: entries snapshot may or may not include the new one yet
    patch.count=Math.max(S.entries.length,(curNote()&&curNote().count||0)+1);
    if(S.noteId===p.noteId) renderFeed();
    S.store.updateNote(p.noteId,patch).catch(()=>{});
  }catch(e){
    p.failed=true; renderFeed();
    toast(e&&e.message==='noassets'?'אין הרשאה להעלות תמונות בתצוגה זו':(e&&e.message==='decode'?'פורמט התמונה לא נתמך':'השליחה נכשלה'));
  }
}
async function compress(file){
  const url=URL.createObjectURL(file);
  try{
    let img; try{ img=await loadImg(url); }catch(e){ throw new Error('decode'); }
    let w=img.naturalWidth, h=img.naturalHeight; const s=Math.min(1,1800/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
    const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
    x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
    if(!blob) throw new Error('decode');
    return {blob,w,h};
  } finally { URL.revokeObjectURL(url); }
}

/* image picking */
$('#attachBtn').addEventListener('click',()=>$('#fileInput').click());
$('#cameraBtn').addEventListener('click',()=>$('#cameraInput').click());
['#fileInput','#cameraInput'].forEach(sel=>$(sel).addEventListener('change',e=>{ addFiles([...e.target.files]); e.target.value=''; }));
function addFiles(files){
  files=files.filter(f=>f.type.startsWith('image/')||/\.(jpe?g|png|webp|gif|heic|heif)$/i.test(f.name));
  if(!files.length) return;
  if(!S.store.canImages){ toast('אין הרשאה להעלות תמונות בתצוגה זו'); return; }
  const wasOpen=!$('#preview').classList.contains('hidden');
  const items=files.map(f=>({file:f,url:URL.createObjectURL(f),caption:''}));
  if(!wasOpen){ S.pv={items:[],idx:0}; if(mi.value.trim()){ items[0].caption=mi.value.trim(); mi.value=''; autoGrow(mi); $('#sendBtn').disabled=true; } }
  S.pv.items.push(...items); S.pv.idx=S.pv.items.length-items.length;
  $('#preview').classList.remove('hidden'); renderPv();
}
function renderPv(){
  const {items,idx}=S.pv; const it=items[idx]; if(!it){ closePv(); return; }
  $('#pvImg').src=it.flatUrl||it.url; $('#pvCaption').value=it.caption; autoGrow($('#pvCaption'));
  $('#pvCount').textContent=items.length>1?`${idx+1} / ${items.length}`:'';
  $('#pvThumbs').innerHTML=(items.length>1?items.map((x,i)=>`<div class="th ${i===idx?'on':''}" data-i="${i}" style="background-image:url('${x.flatUrl||x.url}')"></div>`).join(''):'')+'<button class="add" id="pvAdd" aria-label="הוסף">+</button>';
}
function closePv(revoke=true){ if(revoke) S.pv.items.forEach(x=>{ URL.revokeObjectURL(x.url); if(x.origUrl) URL.revokeObjectURL(x.origUrl); if(x.flatUrl) URL.revokeObjectURL(x.flatUrl); }); S.pv={items:[],idx:0}; $('#preview').classList.add('hidden'); $('#pvImg').src=''; }
$('#pvThumbs').addEventListener('click',e=>{ if(e.target.id==='pvAdd'){ $('#fileInput').click(); return; } const t=e.target.closest('.th'); if(t){ S.pv.idx=+t.dataset.i; renderPv(); } });
$('#pvCaption').addEventListener('input',e=>{ const it=S.pv.items[S.pv.idx]; if(it) it.caption=e.target.value; autoGrow(e.target); });
$('#pvCaption').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){ e.preventDefault(); $('#pvSend').click(); } });
$('#pvClose').addEventListener('click',()=>closePv());
$('#pvEdit').addEventListener('click', async ()=>{
  const it=S.pv.items[S.pv.idx]; if(!it) return;
  if(!it.orig){ busy(true,'טוען…'); try{ it.orig=await compress(it.file); it.origUrl=URL.createObjectURL(it.orig.blob); }catch(e){ busy(false); toast('לא ניתן לפתוח את התמונה'); return; } busy(false); }
  const r=await openEditor({src:it.origUrl,ops:it.ops||[],rot:it.rot||0}); if(!r) return;
  if(it.flatUrl){ URL.revokeObjectURL(it.flatUrl); it.flatUrl=null; }

  else { it.flat=r; it.ops=r.ops; it.rot=r.rot; it.flatUrl=URL.createObjectURL(r.blob); }

});
$('#pvRemove').addEventListener('click',()=>{ const it=S.pv.items.splice(S.pv.idx,1)[0]; if(it) URL.revokeObjectURL(it.url); S.pv.idx=Math.min(S.pv.idx,S.pv.items.length-1); renderPv(); });
$('#pvSend').addEventListener('click', async ()=>{

/* ---------- image editor (draw / shapes / marks) ---------- */
const ED={open:false,ops:[],undo:[],redo:[],rot:0,W:0,H:0,img:null,draft:null,tool:'arrow',color:'#e53935',size:1,resolve:null};
const svgI=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const TOOLS=[
  {k:'pen',label:'עט',ic:svgI('<path d="M4 20c3-1 4-3 6-6s4-6 7-8"/><path d="M15 4l5 5"/>')},
  {k:'hl',label:'מרקר',ic:svgI('<path d="M4 20h7"/><path d="M14 4l6 6-8 8H6v-6z"/>')},
  {k:'arrow',label:'חץ',ic:svgI('<path d="M5 19L19 5M10 5h9v9"/>')},
  {k:'line',label:'קו',ic:svgI('<path d="M5 19L19 5"/>')},
  {k:'rect',label:'מלבן',ic:svgI('<rect x="4" y="6" width="16" height="12" rx="1"/>')},
  {k:'ellipse',label:'עיגול',ic:svgI('<ellipse cx="12" cy="12" rx="8.5" ry="6.5"/>')},
  {k:'text',label:'טקסט',gl:'T'},
  {k:'num',label:'מספור',gl:'①'},
  {k:'ok',label:'תקין',gl:'✓'},
  {k:'bad',label:'ליקוי',gl:'✗'},
  {k:'warn',label:'שים לב',gl:'!'}
];
const ED_COLORS=['#e53935','#ffb300','#43a047','#1e88e5','#ffffff','#111111'];
const STROKE=[3,6,11], TEXTS=[30,46,66], STAMPS=[46,70,100];
const isStamp=t=>t==='num'||t==='ok'||t==='bad'||t==='warn';

function edUnit(){ return Math.max(ED.W,ED.H)/1000; }
function drawOp(x,o){
  x.save(); x.lineCap='round'; x.lineJoin='round'; x.strokeStyle=o.c; x.fillStyle=o.c; x.lineWidth=o.w||1;
  switch(o.t){
    case 'pen': case 'hl':
      if(o.t==='hl'){ x.globalAlpha=.38; x.lineCap='butt'; }
      x.beginPath(); o.pts.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));
      if(o.pts.length===1) x.lineTo(o.pts[0][0]+.1,o.pts[0][1]);
      x.stroke(); break;
    case 'line': x.beginPath(); x.moveTo(o.x1,o.y1); x.lineTo(o.x2,o.y2); x.stroke(); break;
    case 'arrow': {
      const a=Math.atan2(o.y2-o.y1,o.x2-o.x1), L=Math.max(o.w*4.2,20);
      x.beginPath(); x.moveTo(o.x1,o.y1); x.lineTo(o.x2-Math.cos(a)*L*.7,o.y2-Math.sin(a)*L*.7); x.stroke();
      x.beginPath(); x.moveTo(o.x2,o.y2); x.lineTo(o.x2-L*Math.cos(a-.42),o.y2-L*Math.sin(a-.42)); x.lineTo(o.x2-L*Math.cos(a+.42),o.y2-L*Math.sin(a+.42)); x.closePath(); x.fill(); break; }
    case 'rect': x.strokeRect(Math.min(o.x1,o.x2),Math.min(o.y1,o.y2),Math.abs(o.x2-o.x1),Math.abs(o.y2-o.y1)); break;
    case 'ellipse': x.beginPath(); x.ellipse((o.x1+o.x2)/2,(o.y1+o.y2)/2,Math.abs(o.x2-o.x1)/2||1,Math.abs(o.y2-o.y1)/2||1,0,0,Math.PI*2); x.stroke(); break;
    case 'text': {
      try{ x.direction='rtl'; }catch(e){}
      x.font=`700 ${o.s}px Heebo, Arial`; x.textAlign='center'; x.textBaseline='middle';
      const lines=String(o.text).split('\n'), lh=o.s*1.2;
      lines.forEach((l,i)=>{ const yy=o.y+(i-(lines.length-1)/2)*lh; x.lineWidth=o.s/5; x.strokeStyle=o.c==='#ffffff'?'#000':'#fff'; x.strokeText(l,o.x,yy); x.fillStyle=o.c; x.fillText(l,o.x,yy); });
      break; }
    default: if(isStamp(o.t)){
      const r=o.s/2; x.beginPath(); x.arc(o.x,o.y,r,0,Math.PI*2); x.fill();
      x.lineWidth=r*.14; x.strokeStyle=o.c==='#ffffff'?'#111':'#fff'; x.stroke();
      const fg=o.c==='#ffffff'||o.c==='#ffb300'?'#111':'#fff'; x.strokeStyle=fg; x.fillStyle=fg; x.lineWidth=r*.22;
      if(o.t==='ok'){ x.beginPath(); x.moveTo(o.x-r*.45,o.y+r*.02); x.lineTo(o.x-r*.1,o.y+r*.36); x.lineTo(o.x+r*.46,o.y-r*.3); x.stroke(); }

function edRender(){

/* ---------- shared layout helpers ---------- */
const fitBox=(w,h,mw,mh)=>{ w=w||4; h=h||3; const s=Math.min(mw/w,mh/h); return {w:w*s,h:h*s}; };
const mctx=document.createElement('canvas').getContext('2d');
function wrapText(text,font,maxW){
  mctx.font=font; const out=[];
  for(const para of String(text).split('\n')){
    if(!para.trim()){ out.push(''); continue; }
    let line='';
    for(const w of para.split(/\s+/).filter(Boolean)){
      const t=line?line+' '+w:w;
      if(mctx.measureText(t).width<=maxW){ line=t; continue; }
      if(line) out.push(line);
      if(mctx.measureText(w).width>maxW){ let ch=''; for(const c of w){ if(mctx.measureText(ch+c).width>maxW){ out.push(ch); ch=c; } else ch+=c; } line=ch; }
      else line=w;
    }
    out.push(line);
  }
  while(out.length&&out[out.length-1]==='') out.pop();
  return out;
}
async function ensureDims(entries){
  for(const e of entries){ if(e._src&&!(e.w&&e.h)){ try{ const im=await loadImg(e._src); e.w=im.naturalWidth; e.h=im.naturalHeight; }catch(err){} } }
}
function headerInfo(note,entries,o){
  const first=entries[0].createdAt,last=entries[entries.length-1].createdAt,now=Date.now();
  const imgs=entries.filter(e=>e._src).length;
  const parts=[];
  if(o.dates) parts.push(dayKey(first)===dayKey(last)?fmtDate(first):`${fmtDate(first)} – ${fmtDate(last)}`);
  parts.push(`${entries.length} רשומות${imgs?`, ${imgs} תמונות`:''}`);
  if(o.by) parts.push('הוכן ע״י '+o.by);
  parts.push('הופק '+fmtDate(now));
  return parts.join('  ·  ');
}

/* ---------- PDF ---------- */
async function buildPdf(note,entries,o){
  try{ await Promise.all(['400','500','700'].map(w=>document.fonts.load(w+' 30px Heebo'))); }catch(e){}
  await ensureDims(entries);
  const W=1240,H=1754,M=84,CW=W-2*M,FOOT=64,BOTTOM=H-M-FOOT;
  const F={title:'700 48px Heebo, Arial',det:'500 28px Heebo, Arial',sub:'400 23px Heebo, Arial',day:'700 25px Heebo, Arial',meta:'500 22px Heebo, Arial',
    body:'400 29px Heebo, Arial',cell:'400 26px Heebo, Arial',th:'700 24px Heebo, Arial',num:'700 28px Heebo, Arial',foot:'400 20px Heebo, Arial'};
  const pages=[[]]; let pg=pages[0], y=M, onNew=null;
  const newPage=()=>{ pg=[]; pages.push(pg); y=M; if(onNew) onNew(); };
  const need=h=>{ if(y+h>BOTTOM&&y>M+(onNew?60:1)) newPage(); };
  const T=(text,font,color,x,yy,a='right')=>pg.push({t:'text',font,color,text,x,y:yy,a});

  // header
  for(const l of wrapText(o.title,F.title,CW)){ T(l,F.title,'#111b21',W-M,y+46); y+=62; }
  if(o.details) for(const l of wrapText(o.details,F.det,CW)){ T(l,F.det,'#33424b',W-M,y+30); y+=42; }
  for(const l of wrapText(headerInfo(note,entries,o),F.sub,CW)){ T(l,F.sub,'#667781',W-M,y+26); y+=36; }
  y+=12; pg.push({t:'rect',x:M,y,w:CW,h:4,color:'#1aa37a'}); y+=36;

  if(o.tpl==='grid'){
    const GAP=30, colW=(CW-GAP)/2, P=18, inW=colW-2*P, IMGH=400, LH=37;
    for(let i=0;i<entries.length;i+=2){
      const cells=entries.slice(i,i+2).map((e,j)=>{
        const idx=i+j, b=e._src?fitBox(e.w,e.h,inW,IMGH):null;
        let lines=e.text&&e.text.trim()?wrapText(e.text.trim(),F.cell,inW):[];
        if(lines.length>10){ lines=lines.slice(0,10); lines[9]+='…'; }
        const meta=[o.nums?`#${idx+1}`:'',o.dates?fmtDate(e.createdAt)+' '+fmtTime(e.createdAt):''].filter(Boolean).join('  ·  ');
        const h=P+(meta?34:0)+(b?IMGH+(lines.length?14:0):0)+lines.length*LH+P;
        return {e,b,lines,meta,h};
      });
      const rowH=Math.max(...cells.map(c=>c.h));
      need(rowH);
      cells.forEach((c,j)=>{
        const cx=j===0?W-M-colW:M;
        pg.push({t:'rr',x:cx,y,w:colW,h:rowH,r:14,fill:'#fbfaf8',stroke:'#e2ddd4'});
        let yy=y+P;
        if(c.meta){ T(c.meta,F.meta,'#0d6b5e',cx+colW-P,yy+24); yy+=34; }
        if(c.b){ pg.push({t:'img',e:c.e,x:cx+P+(inW-c.b.w)/2,y:yy+(IMGH-c.b.h)/2,w:c.b.w,h:c.b.h,r:10}); yy+=IMGH+14; }
        for(const l of c.lines){ if(l) T(l,F.cell,'#111b21',cx+colW-P,yy+27); yy+=LH; }
      });
      y+=rowH+GAP;
    }
  } else if(o.tpl==='table'){
    const cols=[];
    if(o.nums) cols.push({k:'num',w:66,h:'#'});
    cols.push({k:'img',w:o.cols?300:340,h:'תמונה'});
    cols.push({k:'desc',w:0,h:'תיאור'});
    if(o.cols) cols.push({k:'x',w:150,h:'אחראי'},{k:'x',w:135,h:'תאריך יעד'},{k:'x',w:125,h:'סטטוס'});
    const dsc=cols.find(c=>c.k==='desc'); dsc.w=CW-cols.reduce((s,c)=>s+c.w,0);
    let xr=W-M; for(const c of cols){ c.x=xr-c.w; xr=c.x; }
    const HR=54, P=14, LH=36;
    const headRow=()=>{ pg.push({t:'rect',x:M,y,w:CW,h:HR,color:'#0d6b5e'});
      for(const c of cols){ T(c.h,F.th,'#ffffff',c.x+c.w/2,y+36,'center'); if(c.x>M) pg.push({t:'rect',x:c.x,y,w:2,h:HR,color:'#3d8a7e'}); }
      y+=HR; };
    headRow(); onNew=headRow;
    const maxBody=BOTTOM-M-HR-2*P;
    entries.forEach((e,i)=>{
      const imgC=cols.find(c=>c.k==='img');
      const b=e._src?fitBox(e.w,e.h,imgC.w-2*P,280):null;

    {name:'word/_rels/document.xml.rels',data:docRels},...media
  ],'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
}

/* ---------- backup / restore ---------- */
$('#listMenuBtn').addEventListener('click', async ()=>{
  const mItems=[{label:'גיבוי כל הפתקים לקובץ',icon:'backup',value:'backup'},{label:'שחזור מקובץ גיבוי',icon:'restore',value:'restore'}];
  if(!isStandalone()) mItems.push({label:'התקנה כאפליקציה',icon:'phone',value:'install'});
  if(navigator.share&&/^https?:/.test(location.protocol)) mItems.push({label:'שליחת קישור לאפליקציה',icon:'share',value:'shareapp'});
  const a=await sheet(mItems);
  if(a==='install'){ installApp(); return; }
  if(a==='shareapp'){ try{ await navigator.share({title:'Notesapp',text:'Notesapp — פתקי תמונות — פתח בדפדפן והוסף למסך הבית:',url:location.href.split('#')[0]}); }catch(e){} return; }
  if(a==='backup'){
    busy(true,'מכין גיבוי…');
    try{ const d=await S.store.exportAll(); const blob=new Blob([JSON.stringify(d)],{type:'application/json'});
      busy(false); const name=`גיבוי-פתקים-${fmtDate(Date.now()).replace(/\./g,'-')}.json`;
      const items=[]; if(canShareFiles()) items.push({label:'שיתוף (Drive, מייל, וואטסאפ…)',icon:'share',value:'share'}); items.push({label:'שמירה למכשיר',icon:'backup',value:'save'});
      const c=items.length>1?await sheet(items):'save';
      if(c==='share'){ if(!(await shareFile(blob,name,'גיבוי פתקים'))) saveFile(blob,name); } else if(c==='save'){ saveFile(blob,name); toast('הגיבוי נשמר בהורדות'); }
    }catch(e){ busy(false); toast('הגיבוי נכשל'); }
  } else if(a==='restore') $('#restoreInput').click();
});
$('#restoreInput').addEventListener('change', async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  busy(true,'משחזר…');
  try{ const txt=await f.text(); let data;
    if(/^\s*</.test(txt)){ const m=txt.match(/<script id="pn-data" type="application\/json">([\s\S]*?)<\/script>/); if(!m||!m[1].trim()) throw new Error('nodata'); data=JSON.parse(m[1]); }
    else data=JSON.parse(txt);
    const r=await S.store.importAll(data); busy(false); toast(r.added||r.updated?`שוחזרו ${r.added} פתקים${r.updated?`, ${r.updated} עדכונים`:''}`:'כל הפתקים בקובץ כבר קיימים'); }
  catch(err){ busy(false); toast('קובץ הגיבוי לא תקין'); }
});

/* ---------- install (PWA) ---------- */
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; showInstallHint(); });
window.addEventListener('appinstalled',()=>{ installEvt=null; $('#installHint').classList.add('hidden'); toast('האפליקציה הותקנה'); });
const SHARE_IC='<svg class="ib" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
function showInstallHint(force){
  if(isStandalone()) return;
  if(!force&&LS.get('pn-hint-off')) return;
  const h=$('#installHint');
  const inApp=isIOS&&/CriOS|FxiOS|EdgiOS|FBAN|FBAV|Instagram|WhatsApp/.test(navigator.userAgent);
  if(installEvt) h.innerHTML=`<div style="flex:1"><b>התקן כאפליקציה</b> — אייקון במסך הבית, מסך מלא ועבודה גם בלי אינטרנט.<br><button class="go" id="goInstall">התקנה</button></div><button class="x" aria-label="סגירה">×</button>`;
  else if(isIOS) h.innerHTML=`<div style="flex:1">${inApp?'כדי להתקין באייפון — פתח את הקישור ב-<b>Safari</b>, ואז ':'כדי להתקין באייפון — '}לחץ על כפתור השיתוף ${SHARE_IC} ובחר <b>"הוספה למסך הבית"</b>.</div><button class="x" aria-label="סגירה">×</button>`;
  else return;
  h.classList.remove('hidden');
  h.querySelector('.x').onclick=()=>{ h.classList.add('hidden'); LS.set('pn-hint-off','1'); };
  const g=h.querySelector('#goInstall'); if(g) g.onclick=installApp;
}
async function installApp(){
  if(installEvt){ installEvt.prompt(); try{ await installEvt.userChoice; }catch(e){} installEvt=null; $('#installHint').classList.add('hidden'); return; }
  if(isIOS){ showInstallHint(true); return; }
  await ask({title:'התקנה כאפליקציה',message:'בתפריט הדפדפן (⋮) בחר "התקנת אפליקציה" או "הוספה למסך הבית".',okText:'הבנתי',noCancel:true});
}

/* ---------- boot ---------- */
async function boot(){
  S.store=await makeLocalStore();
  $('#syncBadge').textContent=S.store.kind==='local'?'💾 נשמר במכשיר':'⚠ ללא שמירה';
  showInstallHint();
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  let routed=false;
  S.store.watchNotes(list=>{
    S.notes=list; S.notesLoaded=true;
    renderList(); if(S.noteId) renderHead();
    if(!routed){ routed=true; route(); }
  });
}
boot();
})();
</script>
